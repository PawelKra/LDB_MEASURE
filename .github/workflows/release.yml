name: build & release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}
  pull_request:
    paths:
      - '**.py'
      - requirements.txt
      - packaging/**
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: LDB_Measure-windows-x64.exe
          - os: macos-13            # Intel
            asset: LDB_Measure-macos-x86_64.dmg
          - os: macos-14            # Apple Silicon
            asset: LDB_Measure-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Run test suite
        run: python -m pytest testy/ -q

      - name: Build with PyInstaller
        env:
          LDB_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        run: pyinstaller --noconfirm packaging/LDB_Measure.spec

      - name: Package macOS .app into a .dmg
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname LDB_Measure \
            -srcfolder "dist/LDB_Measure.app" \
            -ov -format UDZO "dist/${{ matrix.asset }}"

      - name: Rename Windows executable
        if: runner.os == 'Windows'
        run: Rename-Item dist/LDB_Measure.exe "${{ matrix.asset }}"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
